<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yesh Video Editor</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to bottom right, #1f1c2c, #928dab);
      color: #fff;
      overflow-x: hidden;
    }

    header {
      text-align: center;
      padding: 2rem 1rem;
      background: #0d0d0d;
      box-shadow: 0 5px 20px rgba(0,0,0,0.6);
    }

    header h1 {
      font-size: 3rem;
      margin: 0;
      background: linear-gradient(to right, #30cfd0 0%, #330867 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeInDown 1s ease-in-out;
    }

    .section-title {
      text-align: center;
      font-size: 2rem;
      margin-top: 2rem;
      animation: fadeInUp 1s ease-in-out;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }

    .video-card {
      background: #222;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.7);
      transition: transform 0.3s;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .video-card:hover {
      transform: scale(1.05);
    }

    .video-card video {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }

    .video-card button {
      width: 100%;
      padding: 1rem;
      background: #25d366;
      color: #fff;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: background 0.3s;
    }

    .video-card button:hover {
      background: #128c7e;
    }

    .contact {
      text-align: center;
      margin: 3rem auto;
    }

    .contact a {
      padding: 1rem 2rem;
      background: #25d366;
      color: white;
      font-weight: bold;
      border-radius: 30px;
      text-decoration: none;
      transition: background 0.3s;
    }

    .contact a:hover {
      background: #128c7e;
    }

    footer {
      background: #111;
      color: #ccc;
      padding: 2rem;
      text-align: center;
      margin-top: 3rem;
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
